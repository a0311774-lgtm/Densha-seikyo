<!DOCTYPE html>
<html lang="zh-HK">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no"
    />
    <meta name="theme-color" content="#090a0e" />
    <meta name="color-scheme" content="dark" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="電車聲響" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="跟住 GPS 車速，即時合成汽油引擎聲同六前速波段。加入 iPhone 主畫面即可當 App 使用。"
    />
    <title>電車聲響</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/icon-512.png" />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <div class="app" id="app">
      <div class="stack">
        <header class="header">
          <div>
            <h1>電車聲響</h1>
            <p id="speed-source">未有有效車速</p>
          </div>
          <div class="pill" id="status-pill" aria-label="定位狀態">
            <span class="pill-dot" id="status-dot" data-tone="wait"></span>
            <span id="status-text">等待定位權限</span>
          </div>
        </header>

        <div class="gauges">
          <div class="gauge-wrap">
            <canvas id="tacho" width="376" height="376" role="img" aria-label="轉速"></canvas>
          </div>
          <div class="gauge-wrap">
            <canvas id="speedo" width="472" height="472" role="img" aria-label="時速"></canvas>
          </div>
        </div>

        <section class="gear" aria-label="波段">
          <div class="gear-label">波段</div>
          <div id="gear-display">N</div>
          <div class="gates" id="gear-gates"></div>
        </section>

        <section class="banner" id="status-banner">
          <svg class="banner-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="1.8">
            <path d="M12 3.5c4.2 0 7.5 2.2 9.2 4.4a14.4 14.4 0 0 1 1.3 1.9l-10.5 10.2L1.5 9.8A14.4 14.4 0 0 1 2.8 7.9C4.5 5.7 7.8 3.5 12 3.5Z" />
            <circle cx="12" cy="11" r="2.4" />
          </svg>
          <div>
            <h2 id="banner-title">等待定位權限</h2>
            <p id="banner-detail">第一次使用時，請允許 Safari 存取位置，先可以按車速配引擎聲。</p>
          </div>
        </section>

        <section class="controls">
          <button class="engine-btn" id="engine-btn" type="button" data-state="off" aria-label="啟動">
            <span class="ring"></span>
            <span class="engine-face">
              <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" aria-hidden="true">
                <path d="M12 3v9" stroke-linecap="round" />
                <path d="M7.2 5.4A8 8 0 1 0 16.8 5.4" stroke-linecap="round" />
              </svg>
              <span id="engine-label">啟動</span>
            </span>
          </button>
          <div class="volume">
            <div class="volume-row">
              <svg id="volume-icon-on" class="volume-icon" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.8v12.4L7.2 14.5H4V9.5Zm11.1-2.2a6.4 6.4 0 0 1 0 9.4l-1.2-1.2a4.7 4.7 0 0 0 0-7l1.2-1.2Zm2.5-2.5a10 10 0 0 1 0 14.4l-1.2-1.2a8.3 8.3 0 0 0 0-12l1.2-1.2Z" />
              </svg>
              <svg id="volume-icon-off" class="volume-icon" hidden viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
                <path d="M4 9.5h3.2L12 5.8v12.4L7.2 14.5H4V9.5Zm16.3-3.2 1.2 1.2-3.2 3.2 3.2 3.2-1.2 1.2-3.2-3.2-3.2 3.2-1.2-1.2 3.2-3.2-3.2-3.2 1.2-1.2 3.2 3.2 3.2-3.2Z" />
              </svg>
              <span class="label">音量</span>
              <span class="value" id="volume-value">75%</span>
            </div>
            <input id="volume" type="range" min="0" max="100" value="75" step="1" aria-label="音量" />
          </div>
        </section>

        <p class="audio-error" id="audio-error" hidden></p>

        <section class="panel" aria-label="示範模式">
          <div class="demo-head">
            <div class="demo-copy">
              <h2>示範模式</h2>
              <p id="demo-subtitle">未有有效 GPS 車速時，可開啟示範模式室內試用。</p>
            </div>
            <label class="toggle">
              <input id="demo-toggle" type="checkbox" aria-label="示範模式" />
              <span></span>
            </label>
          </div>
          <div id="demo-slider-wrap" hidden>
            <div class="demo-speed-row">
              <span class="label">示範車速</span>
              <span class="value" id="demo-speed-value">40 km/h</span>
            </div>
            <input id="demo-speed" type="range" min="0" max="200" value="40" step="1" aria-label="示範車速" />
          </div>
          <button class="linkish" id="allow-location" type="button">允許使用位置</button>
        </section>

        <div class="install-hint" id="install-hint" hidden>
          <div>
            喺 Safari 按<strong>分享</strong>，然後揀<strong>加入主畫面</strong>，以後就可以好似 App 咁開啟（離線都可以用畫面；GPS 仍然需要定位）。
          </div>
          <button class="dismiss" id="dismiss-install" type="button" aria-label="關閉提示">×</button>
        </div>

        <p class="footnote">網頁 App · 唔會追蹤、唔會出外聯網路</p>
      </div>
    </div>
    <script type="module" src="./js/main.js"></script>
  </body>
</html>
